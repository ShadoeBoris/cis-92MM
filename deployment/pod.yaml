apiVersion: v1
kind: Pod
metadata:
  labels:
    function: app
  name: dokuwiki-pod
spec:
  containers:
  - env:
    - name: STUDENT_NAME
      value: Boris Jocoy
    - name: SITE_NAME
      value: '*'
    envFrom:
    - configMapRef:
        name: mysite-config
    - secretRef:
        name: mysite-secret
    image: dokuwiki/dokuwiki:stable
    name: dokuwiki-container
    ports:
    - containerPort: 8080
    resources:
      limits:
        cpu: 1000m
        ephemeral-storage: 10Mi
        memory: 512Mi
      requests:
        cpu: 1000m
    volumeMounts:
    - mountPath: /data
      name: db
  volumes:
  - name: db
    persistentVolumeClaim:
      claimName: mysite-data
  securityContext:
    fsGroup: 1000

