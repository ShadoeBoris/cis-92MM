apiVersion: v1
kind: Pod
metadata:
  name: django
  labels:
    function: app
    version: v1
spec:
  securityContext:
    fsGroup: 1000
  containers:
  - name: django
    image: ghcr.io/shadoeboris/cis-92mm:latest
    envFrom:
      - configMapRef:
           name: mysite-config
      - secretRef:
          name: mysite-secret
    ports:
    - containerPort: 8080
    resources:
      requests:
        cpu: 1000m
        memory: 512Mi
        ephemeral-storage: 10Mi
      limits:
        cpu: 1000m
        memory: 512Mi
        ephemeral-storage: 10Mi
    volumeMounts:
    - name: db
      mountPath: /data   
    env:
    - name: STUDENT_NAME
      value: "Boris Jocoy"
    - name: SITE_NAME
      value: "*"
    - name: SECRET_KEY
      value: "jfhajklfhadkuahfuaehwuhdf83839ufhdfhjk"  
    - name: DEBUG
      value: "1"
    - name: DATA_DIR
      value: "/data"
    - name: PORT
      value: "8080"
    - name: DJANGO_SUPERUSER_NAME
      value: "admin"
    - name: DJANGO_SUPERUSER_PASSWORD
      value: "password"
    - name: DJANGO_SUPERUSER_EMAIL 
      value: "admin@admin.com"
  volumes:
  - name: db
    persistentVolumeClaim:
      claimName: mysite-data


